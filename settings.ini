[fprime]
project_root: .
framework_path: ./lib/fprime
library_locations: ./lib/fprime-arduino:./lib/fprime-baremetal

default_toolchain: ATmega128

deployment_cookiecutter: https://github.com/nathancheek/fprime-atmega128-deployment-cookiecutter.git

default_cmake_options:  FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                        FPRIME_ENABLE_AUTOCODER_UTS=OFF
